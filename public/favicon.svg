      <stop offset="0%" stop-color="#FF4522" />
      <stop offset="100%" stop-color="#D92B04" />
    </linearGradient>
    <linearGradient id="pv-accent" x1="34" y1="19" x2="56" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5733" />
      <stop offset="100%" stop-color="#D92B04" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Rounded Base -->
